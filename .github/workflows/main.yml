name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test on ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-test-stable-${{ hashFiles('**/Cargo.toml') }}
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Install Dependencies
      run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libxtst-dev libevdev-dev libgtk-3-dev libxdo-dev xvfb --assume-yes
      if: runner.os == 'Linux'
    - name: Run tests (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum cargo test --verbose -- --nocapture
    - name: Run tests (non-Linux)
      if: runner.os != 'Linux'
      run: cargo test --verbose -- --nocapture

  clippy_check:
    name: Clippy
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.toml') }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libxtst-dev libevdev-dev libgtk-3-dev libxdo-dev --assume-yes
      - name: Run clippy
        run: cargo clippy -- -D warnings

  format:
    name: Format
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  build:
    name: build on ${{ matrix.os }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: mantle-linux-x86_64
            binary-path: target/x86_64-unknown-linux-gnu/release/mantle
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: mantle-windows-x86_64
            binary-path: target/x86_64-pc-windows-msvc/release/mantle.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: mantle-macos-aarch64
            binary-path: target/aarch64-apple-darwin/release/mantle
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact-name: mantle-macos-x86_64
            binary-path: target/x86_64-apple-darwin/release/mantle
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-build-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Install Dependencies
      run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libxtst-dev libevdev-dev libgtk-3-dev libxdo-dev librsvg2-dev patchelf file --assume-yes
      if: runner.os == 'Linux'
    - name: Build release
      run: cargo build --release --target ${{ matrix.target }} --verbose
    - name: Build AppImage (Linux)
      if: runner.os == 'Linux'
      env:
        # AppImages need FUSE; extract-and-run avoids requiring it in CI.
        APPIMAGE_EXTRACT_AND_RUN: 1
        OUTPUT: ${{ matrix.artifact-name }}.AppImage
        # Pin the packaging tools to immutable refs and verify their contents so
        # a compromise of the upstream `continuous`/`master` refs can't inject
        # code into published release artifacts.
        LINUXDEPLOY_TAG: 1-alpha-20251107-1
        LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
        LINUXDEPLOY_GTK_COMMIT: 7a3fbc31a9e5075073ff8790f26effbac5f84453
        LINUXDEPLOY_GTK_SHA256: b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171
      run: |
        set -euxo pipefail
        wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_TAG}/linuxdeploy-x86_64.AppImage"
        wget -q "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/${LINUXDEPLOY_GTK_COMMIT}/linuxdeploy-plugin-gtk.sh"
        echo "${LINUXDEPLOY_SHA256}  linuxdeploy-x86_64.AppImage" | sha256sum -c -
        echo "${LINUXDEPLOY_GTK_SHA256}  linuxdeploy-plugin-gtk.sh" | sha256sum -c -
        chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
        # linuxdeploy locates plugins via PATH; ensure the gtk plugin here is found.
        export PATH="$PWD:$PATH"

        mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
        cp "${{ matrix.binary-path }}" AppDir/usr/bin/mantle
        cp res/logo256.png AppDir/usr/share/icons/hicolor/256x256/apps/mantle.png
        {
          echo '[Desktop Entry]'
          echo 'Type=Application'
          echo 'Name=Mantle'
          echo 'Comment=A simple LIFX control application'
          echo 'Exec=mantle'
          echo 'Icon=mantle'
          echo 'Categories=Utility;'
          echo 'Terminal=false'
        } > AppDir/usr/share/applications/mantle.desktop

        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --plugin gtk \
          --output appimage \
          --desktop-file AppDir/usr/share/applications/mantle.desktop \
          --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/mantle.png
    - name: Package macOS binary
      if: runner.os == 'macOS'
      run: |
        chmod +x ${{ matrix.binary-path }}
        tar czf ${{ matrix.artifact-name }}.tar.gz -C $(dirname ${{ matrix.binary-path }}) $(basename ${{ matrix.binary-path }})
    - name: Upload artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{ matrix.artifact-name }}.tar.gz
        if-no-files-found: error
    - name: Upload artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{ matrix.artifact-name }}.AppImage
        if-no-files-found: error
    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{ matrix.binary-path }}
        if-no-files-found: error

  release:
    name: Publish release
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Package binaries for release
        run: |
          cp artifacts/mantle-linux-x86_64/mantle-linux-x86_64.AppImage mantle-linux-x86_64.AppImage
          chmod +x mantle-linux-x86_64.AppImage

          cp artifacts/mantle-macos-aarch64/mantle-macos-aarch64.tar.gz mantle-macos-aarch64.tar.gz
          cp artifacts/mantle-macos-x86_64/mantle-macos-x86_64.tar.gz mantle-macos-x86_64.tar.gz

          mv artifacts/mantle-windows-x86_64/mantle.exe mantle-windows-x86_64.exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mantle-linux-x86_64.AppImage
            mantle-macos-aarch64.tar.gz
            mantle-macos-x86_64.tar.gz
            mantle-windows-x86_64.exe
          generate_release_notes: true
